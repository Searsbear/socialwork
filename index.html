<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Search Pro</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --primary: #06b6d4;
            --secondary: #2dd4bf; --accent: #22d3ee; --text: #f1f5f9; --muted: #94a3b8;
        }
        body { 
            font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg);
            color: var(--text); padding-bottom: 50px; 
            background-image: linear-gradient(rgba(6,182,212,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .header { position: sticky; top: 0; background: linear-gradient(135deg, #083344, #115e59); padding: 25px 15px; text-align: center; z-index: 100; border-bottom: 2px solid var(--primary); }
        #searchBox { width: 90%; max-width: 550px; padding: 15px 25px; border-radius: 12px; border: 2px solid rgba(6,182,212,0.3); background: rgba(15,23,42,0.8); color: var(--primary); font-size: 1.1rem; outline: none; }
        #stats { font-size: 0.75rem; margin-top: 12px; color: var(--secondary); background: rgba(6,182,212,0.15); padding: 5px 15px; border-radius: 4px; text-transform: uppercase; display: inline-block; }
        #actionBar { margin-top: 15px; display: none; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .action-btn { background: var(--card-bg); color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        #results { padding: 20px; max-width: 950px; margin: auto; display: grid; gap: 25px; }
        .card { background: var(--card-bg); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; animation: fadeIn 0.3s ease; }
        .org-header { background: rgba(6, 182, 212, 0.1); padding: 20px; color: var(--primary); font-weight: 800; font-size: 1.3rem; }
        .card-body { padding: 20px; font-size: 0.95rem; line-height: 1.8; white-space: pre-wrap; }
        .label { color: var(--secondary); font-weight: 800; font-size: 0.7rem; text-transform: uppercase; background: rgba(45, 212, 191, 0.1); padding: 3px 12px; border-radius: 4px; border-left: 3px solid var(--secondary); display: inline-block; margin-top: 10px; }
        mark { background: rgba(6, 182, 212, 0.4); color: #fff; padding: 0 2px; border-radius: 2px; }
        a { color: var(--secondary); text-decoration: underline; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        @media print { .header, #actionBar, .welcome { display: none !important; } body { background: white; color: black; } .card { border: 1px solid #ccc !important; page-break-inside: avoid; } }
    </style>
</head>
<body>

<div class="header">
    <h2>Resource Search</h2>
    <input type="text" id="searchBox" placeholder='Example: "food" OR -"women and children"' spellcheck="false">
    <br><div id="stats">Initializing...</div>
    <div id="actionBar">
        <button class="action-btn" onclick="copyAllResults()">📋 Copy Full</button>
        <button class="action-btn" onclick="downloadResults()">📥 Full TXT</button>
        <button class="action-btn" onclick="downloadCompactResults()">📇 Contacts TXT</button>
        <button class="action-btn" onclick="window.print()">🖨️ Print PDF</button>
    </div>
</div>

<div id="results"><div class="welcome" style="text-align:center; padding:50px; color:var(--muted);">Ready to search.</div></div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e => {}); });
    }

    let resources = [];
    let currentFilteredList = [];

    // 1. DATA LOADING
    fetch('montreal2-en.txt').then(res => res.text()).then(text => {
        let cleanText = text.replace(/--- PAGE \d+ ---/g, "").replace(/^\d+$/gm, "");
        let rawBlocks = cleanText.split(/(?<=Legal status: .*\n)/gi);
        if (rawBlocks.length > 0) rawBlocks.shift(); 
        const seen = new Set();
        rawBlocks.forEach(block => {
            let lines = block.trim().split('\n').filter(l => l.trim().length > 0);
            if (lines.length < 3) return;
            let orgName = lines[0].includes(':') ? lines[1] : lines[0];
            const fingerPrint = orgName.toLowerCase().replace(/[^a-z]/g, '').substring(0, 40);
            if (!seen.has(fingerPrint)) { seen.add(fingerPrint); resources.push(block.trim()); }
        });
        document.getElementById('stats').innerText = `DATABASE ONLINE | ${resources.length} RESOURCES`;
    });

    // 2. STATE-MACHINE PARSER (The "Brain")
    function parseQuery(group) {
        const terms = { includes: [], excludes: [] };
        let i = 0;
        while (i < group.length) {
            let char = group[i];
            if (char === ' ') { i++; continue; }
            
            let isExclude = false;
            if (char === '-') { isExclude = true; i++; char = group[i]; }

            let term = "";
            let isPhrase = false;
            if (char === '"') {
                isPhrase = true; i++;
                while (i < group.length && group[i] !== '"') { term += group[i]; i++; }
                i++;
            } else {
                while (i < group.length && group[i] !== ' ') { term += group[i]; i++; }
            }

            if (term && term.toLowerCase() !== 'or') {
                const target = isExclude ? terms.excludes : terms.includes;
                target.push({ text: term.toLowerCase(), isPhrase });
            }
        }
        return terms;
    }

    // 3. SEARCH LOGIC
    document.getElementById('searchBox').addEventListener('input', (e) => {
        const query = e.target.value.trim();
        if (query.length < 2) { 
            document.getElementById('results').innerHTML = '<div class="welcome" style="text-align:center; padding:50px; color:var(--muted);">Ready to search.</div>'; 
            document.getElementById('actionBar').style.display = 'none';
            return; 
        }

        const orGroups = query.split(/\s+OR\s+/i);
        currentFilteredList = resources.filter(block => {
            const content = block.toLowerCase();
            return orGroups.some(group => {
                const { includes, excludes } = parseQuery(group);
                
                const match = (t) => {
                    const esc = t.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const reg = t.isPhrase ? new RegExp(esc, 'i') : new RegExp(`\\b${esc}\\b`, 'i');
                    return reg.test(content);
                };

                return includes.every(match) && !excludes.some(match);
            });
        });

        document.getElementById('actionBar').style.display = currentFilteredList.length > 0 ? 'flex' : 'none';
        document.getElementById('stats').innerText = `FOUND: ${currentFilteredList.length} MATCHES`;
        render(currentFilteredList, query);
    });

    // 4. RENDERING
    function render(list, query) {
        const resultsDiv = document.getElementById('results');
        const hTerms = [];
        const tokens = parseQuery(query.replace(/\s+OR\s+/gi, " "));
        const highlightList = [...tokens.includes.map(t => t.text)];

        resultsDiv.innerHTML = list.slice(0, 100).map(block => {
            const lines = block.split('\n');
            const title = lines[0];
            let body = lines.slice(1).join('\n');

            // Formatter
            body = body.replace(/(\d{3} \d{3}-\d{4})/g, `<a href="tel:$1" style="font-weight:bold">$1</a>`);
            const labels = ["Services:", "Eligibility:", "Hours:", "Website:", "Email:", "Address:"];
            labels.forEach(l => body = body.replace(new RegExp(`(${l})`, "g"), `<span class="label">$1</span>`));

            // Highlighter
            highlightList.sort((a,b) => b.length - a.length).forEach(t => {
                if (t.length < 2) return;
                const esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                body = body.replace(new RegExp(`(?<!<[^>]*)\\b(${esc})\\b`, "gi"), "<mark>$1</mark>");
            });

            return `<div class="card"><div class="org-header">${title}</div><div class="card-body">${body}</div></div>`;
        }).join('');
    }

    // 5. EXPORTS
    function getCleanText() { return currentFilteredList.map(b => `----------\n${b.replace(/<[^>]*>/g, '')}\n`).join('\n'); }
    function copyAllResults() { navigator.clipboard.writeText(getCleanText()).then(() => alert("Copied!")); }
    function downloadResults() {
        const blob = new Blob([getCleanText()], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Resources.txt"; a.click();
    }
    function downloadCompactResults() {
        const compact = currentFilteredList.map(b => {
            const lines = b.split('\n');
            const phone = b.match(/\d{3} \d{3}-\d{4}/) || ["N/A"];
            return `${lines[0].toUpperCase()}\nPhone: ${phone[0]}\n----------`;
        }).join('\n');
        const blob = new Blob([compact], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Contacts.txt"; a.click();
    }
</script>
</body>
</html>
